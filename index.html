<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Gym Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232152E0'/%3E%3Crect x='10' y='20' width='8' height='24' rx='2' fill='white'/%3E%3Crect x='46' y='20' width='8' height='24' rx='2' fill='white'/%3E%3Crect x='18' y='29' width='28' height='6' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Big tiles to pick, big numbers to log, a sticky bar for the next action. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E8EE; --fg:#0F141A; --muted:#5A6573; --line:#D7DDE4;
  --accent:#2152E0; --accent-ink:#FFFFFF; --accent-soft:#DFE7FC; --glow:rgba(33,82,224,.10);
  --done:#13804A; --done-bg:#DCF2E5; --gold:#8F6300; --gold-bg:#FFEFBD; --danger:#B8322A; --danger-bg:#FBE3E0;
  --shadow:0 1px 2px rgba(15,20,26,.06),0 6px 18px rgba(15,20,26,.06);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0E13; --surface:#141A21; --sunk:#1C232C; --fg:#EEF2F6; --muted:#8F9BA8; --line:#252D37;
  --accent:#6E98FF; --accent-ink:#08101F; --accent-soft:#19243F; --glow:rgba(110,152,255,.16);
  --done:#4FD08B; --done-bg:#11291B; --gold:#F5CB4A; --gold-bg:#2E2610; --danger:#FF7B6E; --danger-bg:#3A1714;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#141A21; --sunk:#1C232C; --fg:#EEF2F6; --muted:#8F9BA8; --line:#252D37;
  --accent:#6E98FF; --accent-ink:#08101F; --accent-soft:#19243F; --glow:rgba(110,152,255,.16);
  --done:#4FD08B; --done-bg:#11291B; --gold:#F5CB4A; --gold-bg:#2E2610; --danger:#FF7B6E; --danger-bg:#3A1714;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);min-height:100%}
body{margin:0;min-height:100vh;color:var(--fg);background:radial-gradient(130% 55% at 50% -12%,var(--glow),transparent 62%) no-repeat,var(--bg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
*{box-sizing:border-box}
img,svg{max-width:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:20px}
.wrap.login{padding-bottom:40px;min-height:100vh;justify-content:center}
.wrap.work{padding-top:8px;padding-bottom:130px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:38px;line-height:1;letter-spacing:.005em}
h2{font-size:17px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
h3{font-size:24px;line-height:1.05}
p{margin:0}
.sub,.fine{color:var(--muted)}
.fine{font-size:14px}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
input,select,textarea{font:inherit;font-size:18px;color:var(--fg);background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:10px 14px;min-height:50px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
textarea{min-height:72px;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;min-height:50px;padding:10px 18px;font-weight:600;font-size:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:21px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.btn.big{min-height:58px;width:100%}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{min-height:40px;font-size:15px;padding:6px 14px;border-radius:12px}
.btn.ghost{background:var(--sunk);border-color:transparent}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled),.tile:active,.tick:active{transform:scale(.97)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;min-height:40px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;min-height:42px;font-weight:500;font-size:15px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.soft{background:var(--sunk);border-color:transparent}
.chip.soft.on{background:var(--accent);color:var(--accent-ink)}
.banner{border-radius:16px;padding:14px 16px;font-weight:500}
.banner.warn{background:var(--danger-bg);color:var(--danger)}
.banner.info{background:var(--accent-soft)}
.err{color:var(--danger);font-weight:500}

/* login */
.mark{display:flex;flex-direction:column;gap:14px}
.mark svg{width:180px;height:auto}
.brand{font-family:var(--display);font-weight:800;font-size:76px;line-height:.86;text-transform:uppercase;letter-spacing:-.005em}
.brand span{color:var(--accent);display:block}

/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello .date{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;box-shadow:var(--shadow)}
.tile b{font-family:var(--display);font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.tile small{font-size:13px;color:var(--muted)}
.tile.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.on small{color:var(--accent-ink);opacity:.8}
.tile .ck{position:absolute;top:10px;right:12px;font-size:18px;font-weight:700;opacity:0}
.tile.on .ck{opacity:1}
.resume{border:1.5px solid var(--accent);background:var(--accent-soft)}
.past{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
.past .stack{gap:2px;min-width:0}
.past .fine{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done-card{background:var(--done-bg);border:0}
.done-card b{font-family:var(--display);font-size:26px;line-height:1.05}
.pr-card{background:var(--gold-bg);border:0}
.pr-card .prline{display:flex;gap:10px;align-items:baseline}
.badge{display:inline-block;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;background:var(--gold);color:var(--surface);border-radius:6px;padding:1px 7px}

/* workout */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin:0 -16px;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.pill:empty{display:none}
.pill.saved{background:var(--done-bg);color:var(--done)}
.pill.error,.pill.ro{background:var(--danger-bg);color:var(--danger)}
.progress{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .3s}
.exhead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.exnum{width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted)}
.exnum.all{background:var(--done);color:var(--surface)}
.exhead .tagline{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.count{font-family:var(--display);font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.all{color:var(--done)}
.last{font-size:15px;color:var(--muted)}
.last b{color:var(--fg);font-weight:600}
.target{display:flex;gap:10px;align-items:flex-start;font-size:15px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.target.push{background:var(--gold-bg)}
.target.push .tgt{color:var(--gold)}
.target .tgt{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding-top:2px}
.note{font-size:15px;font-style:italic;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 12px}
.sets{display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.set,.colhead{display:grid;grid-template-columns:30px 1fr 14px 1fr 54px 30px;gap:8px;align-items:center}
.set{border-radius:14px;padding:5px 6px 5px 4px}
.set.done{background:var(--done-bg)}
.set .sn{font-family:var(--display);font-size:20px;text-align:center;color:var(--muted)}
.set .sn.prb{font-size:12px;background:var(--gold);color:var(--surface);border-radius:6px;padding:3px 0;font-weight:800;letter-spacing:.06em}
.set input{text-align:center;padding:8px 4px;min-width:0;font-family:var(--display);font-size:24px;font-weight:600;min-height:50px}
.set.done input{background:transparent}
.set .x{color:var(--muted);font-size:15px;text-align:center}
.tick{width:54px;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.tick svg{width:24px;height:24px}
.set.done .tick{background:var(--done);border-color:var(--done);color:var(--surface)}
.del{width:30px;height:40px;border:0;background:none;color:var(--muted);font-size:16px;opacity:.7}
.colhead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding:0 6px 0 4px}
.colhead span:nth-child(2),.colhead span:nth-child(4){text-align:center}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:42px;border-radius:12px;border:0;background:var(--sunk);font-size:22px}
.stepper output{font-family:var(--display);font-size:24px;min-width:22px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input{font-family:var(--display);font-size:24px;font-weight:600;text-align:center}
.field textarea{font-family:var(--body)}
.settings{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actionbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.actionbar .btn{min-height:54px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}

/* lists, charts */
.list{display:flex;flex-direction:column;gap:8px;font-size:15px}
.list .li{display:flex;justify-content:space-between;gap:12px}
.list .li span:first-child{font-weight:600}
.list .li span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chartbox .grid{stroke:var(--line);stroke-width:1}
.chartbox .ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chartbox .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chartbox .ar{fill:var(--accent);opacity:.12}
.chartbox .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chartbox .hl{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:13px;white-space:nowrap;transform:translate(-50%,-115%);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
td:last-child,th:last-child{text-align:right}
.hero-num{font-family:var(--display);font-weight:800;font-size:52px;line-height:.95;font-variant-numeric:tabular-nums}
.hero-num small{font-size:22px;color:var(--muted);font-weight:600;margin-left:4px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
@media (max-width:370px){.set,.colhead{grid-template-columns:24px 1fr 10px 1fr 48px 26px;gap:6px}.tick{width:48px}.brand{font-size:64px}}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tile,.tick{transition:background-color .15s,border-color .15s,transform .1s}}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* Firebase web config. Not a secret: the Firestore rules decide who can do what. */
const FIREBASE_CONFIG = {

  authDomain: "gym-log-293b5.firebaseapp.com",
  projectId: "gym-log-293b5",
  storageBucket: "gym-log-293b5.firebasestorage.app",
  messagingSenderId: "997368494904",

};
</script>
<script>
const PARTS=[["chest","Chest"],["back","Back"],["shoulders","Shoulders"],["biceps","Biceps"],["triceps","Triceps"],["legs","Legs"],["abs","Abs"],["cardio","Cardio"]];
const PN=Object.fromEntries(PARTS);
const STARTER={
  chest:["Bench press","Incline dumbbell press","Chest press machine","Cable fly","Dips","Push-up"],
  back:["Pull-up","Lat pulldown","Barbell row","Seated cable row","Chest-supported row","Deadlift"],
  shoulders:["Overhead press","Dumbbell shoulder press","Lateral raise","Rear delt fly","Face pull"],
  biceps:["Barbell curl","Dumbbell curl","Hammer curl","Cable curl","Preacher curl"],
  triceps:["Triceps pushdown","Overhead triceps extension","Skull crusher","Close-grip bench press"],
  legs:["Squat","Leg press","Romanian deadlift","Leg extension","Leg curl","Bulgarian split squat","Hip thrust","Calf raise"],
  abs:["Cable crunch","Hanging leg raise","Plank","Ab wheel"],
  cardio:["Treadmill run","Outdoor run","Cycling","Rowing machine","Stair climber","Elliptical","Swimming","Walking"]
};
const BW=new Set(["pull-up","chin-up","dips","push-up","hanging-leg-raise"]);
const SORE=[["none","Never got sore"],["healed","Healed in time"],["still","Still sore"]];
const PUMP=[[1,"Low pump"],[2,"OK pump"],[3,"Great pump"]];
const ICON={
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h2M19 12h2M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/></svg>`,
  history:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>`,
  progress:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-5 4 3 6-7"/></svg>`,
  weight:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9.5a4 4 0 0 1 6 0M12 9.5l1.2-1.6"/></svg>`
};
const BARBELL=`<svg viewBox="0 0 180 64" aria-hidden="true"><rect x="0" y="29" width="180" height="6" rx="3" fill="var(--muted)" opacity=".55"/><rect x="22" y="6" width="14" height="52" rx="4" fill="var(--accent)"/><rect x="38" y="14" width="10" height="36" rx="3" fill="var(--gold)"/><rect x="144" y="6" width="14" height="52" rx="4" fill="var(--accent)"/><rect x="132" y="14" width="10" height="36" rx="3" fill="var(--gold)"/><rect x="50" y="25" width="5" height="14" rx="1.5" fill="var(--muted)"/><rect x="125" y="25" width="5" height="14" rx="1.5" fill="var(--muted)"/></svg>`;

const $app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);
const num=v=>{const n=parseFloat(String(v).replace(",","."));return Number.isFinite(n)?n:null};
const rnd=n=>Math.round(n*100)/100;
const fmtN=n=>n==null||n===""?"-":String(rnd(n));
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad2=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const fmtDate=ms=>new Date(ms).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const fmtShort=ms=>new Date(ms).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const isoMs=iso=>{const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).getTime()};
const e1=(w,r)=>(w>0&&r>0)?w*(1+r/30):0;
const ago=ms=>{const d=Math.floor((new Date().setHours(0,0,0,0)-new Date(ms).setHours(0,0,0,0))/864e5);return d<=0?"today":d===1?"yesterday":d+" days ago"};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const S={db:null,dbReady:false,ro:false,key:null,name:"",acct:null,workouts:[],loaded:false,unsub:null,
  view:"login",cur:null,parts:[],sore:{},repeatFrom:null,flash:null,msg:"",confirm:null,adding:false,addMsg:"",
  openSet:{},progEx:null,saveState:"",lastName:ls.get("gymlog.last","")};

/* ---------- data helpers ---------- */
const acctRef=()=>S.db.doc("accounts/"+S.key);
const wRef=id=>S.db.doc("accounts/"+S.key+"/workouts/"+id);
const doneWs=()=>S.workouts.filter(w=>w.status==="done");
function lastTime(k,excludeId){
  for(const w of doneWs()){
    if(w.id===excludeId)continue;
    const e=(w.ex||[]).find(x=>x.k===k);
    if(!e)continue;
    if(e.type==="cardio"?(e.cardio&&(e.cardio.km||e.cardio.min)):(e.sets||[]).some(s=>s.r>0))return{w,e};
  }
  return null;
}
function bestPrior(k,excludeId){
  let b={e1:0,km:0};
  for(const w of doneWs()){
    if(w.id===excludeId)continue;
    for(const e of (w.ex||[])){
      if(e.k!==k)continue;
      (e.sets||[]).forEach(s=>{b.e1=Math.max(b.e1,e1(s.w,s.r))});
      if(e.cardio)b.km=Math.max(b.km,e.cardio.km||0);
    }
  }
  return b;
}
function suggest(sets,st,sore){
  const lo=st.lo||8,hi=st.hi||12,step=st.step||2.5;
  sets=(sets||[]).filter(s=>s.r>0);
  if(!sets.length)return null;
  if(sore==="still")return{sets:sets.map(s=>({w:s.w,r:s.r})),why:"Still sore, so match last time."};
  if(sets.every(s=>s.r>=hi))return{sets:sets.map(s=>({w:s.w==null?null:rnd(s.w+step),r:Math.max(lo,hi-2)})),why:`Every set hit ${hi} reps. Add ${fmtN(step)} kg and drop to ${Math.max(lo,hi-2)} reps.`};
  return{sets:sets.map(s=>({w:s.w,r:Math.min(hi,s.r+1)})),why:`Same weight, one more rep per set (up to ${hi}).`};
}
/* RP-style volume check: last pump for the body part plus today's soreness.
   One more set when not sore and the pump wasn't great, or when the pump was low. Still sore: no change. */
const MAX_SETS=8;
function volumeAdvice(pump,sore){
  if(sore==="still")return{add:0,msg:""};
  if(sore==="none"&&pump!==3)return{add:1,msg:`No soreness and ${pump===1?"a low pump":pump===2?"an OK pump":"no pump rating"} last time, so one extra set today.`};
  if(pump===1)return{add:1,msg:"Low pump last time, so one extra set today."};
  return{add:0,msg:""};
}
/* Pump is rated once per body part when the workout ends. The last workout that trained the part decides. */
function lastPartPump(p,excludeId){
  for(const w of doneWs()){
    if(w.id===excludeId||!(w.ex||[]).some(e=>e.part===p))continue;
    return w.pump&&w.pump[p]!=null?w.pump[p]:null;
  }
  return null;
}
function liftParts(c){return [...new Set(c.ex.filter(e=>e.type!=="cardio"&&e.sets&&e.sets.some(s=>(s.done||s.t)&&s.r>0)).map(e=>e.part))]}
function latestBW(){const b=(S.acct.bodyweight||[]);return b.length?b[b.length-1].kg:null}
function buildEntry(k,st,sore){
  const e={k,name:st.name,part:st.part,type:st.type};
  if(st.type==="cardio"){e.cardio={min:null,km:null,eff:null};return e}
  const last=lastTime(k,S.cur&&S.cur.id);
  const sug=last?suggest(last.e.sets,st,sore&&sore[st.part]):null;
  if(sug){
    const lp=lastPartPump(st.part,S.cur&&S.cur.id);
    const adv=volumeAdvice(lp!=null?lp:last.e.pump,sore&&sore[st.part]);
    if(adv.add&&sug.sets.length<MAX_SETS)sug.sets.push(Object.assign({},sug.sets[sug.sets.length-1]));
    if(adv.msg)e.push=adv.msg;
    e.tgt=sug.sets;e.why=sug.why;e.sets=sug.sets.map(s=>({w:s.w,r:s.r,done:false}));
  }
  else{const bw=BW.has(k)?latestBW():null;e.sets=[0,1,2].map(()=>({w:bw,r:null,done:false}))}
  e.pump=null;return e;
}
function lastTrained(p){for(const w of doneWs())if((w.ex||[]).some(e=>e.part===p))return w.startedAt;return null}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function setsDone(w){return (w.ex||[]).reduce((n,e)=>n+(e.sets?e.sets.filter(s=>s.done).length:(e.cardio&&(e.cardio.km||e.cardio.min)?1:0)),0)}

/* ---------- saving ---------- */
let saveT=null,saving=false,again=false,retried=false,acctChain=Promise.resolve();
function writeErr(e){
  if(e&&e.code==="permission-denied"){S.ro=true;S.saveState="ro";render()}
  else{S.saveState="error";if(!retried){retried=true;setTimeout(()=>{retried=false;doSave()},4000)}}
  pill();
}
function saveCur(){if(S.ro||!S.cur)return;S.saveState="pending";pill();clearTimeout(saveT);saveT=setTimeout(doSave,600)}
async function doSave(){
  if(!S.cur||S.ro)return;
  if(saving){again=true;return}
  saving=true;S.saveState="saving";pill();
  const {id,...data}=S.cur;
  try{await wRef(id).set(clone(data));S.saveState="saved"}catch(e){writeErr(e)}
  saving=false;pill();
  if(again){again=false;await doSave()}
}
/* Offline at the gym: the write lands on the phone at once and syncs later, so never wait more than 2 s. */
async function saveNow(){clearTimeout(saveT);await Promise.race([(async()=>{while(saving)await sleep(80);await doSave()})(),sleep(2000)])}
function saveAcct(patch){if(S.ro)return;acctChain=acctChain.then(()=>acctRef().set(clone(patch),{merge:true})).catch(writeErr)}
function pill(){const p=document.getElementById("savePill");if(!p)return;const t={pending:"Saving",saving:"Saving",saved:"Saved",error:"Not saved, retrying",ro:"Read only"}[S.saveState]||"";p.textContent=t;p.className="pill "+S.saveState}

/* ---------- login ---------- */
async function login(name){
  name=String(name||"").trim();const key=slug(name);
  if(!key){S.msg="Type a name first.";return render()}
  if(!S.db){S.msg="Can't reach the database. Check your internet and reload.";return render()}
  S.msg="Opening your log...";render();
  try{
    const snap=await S.db.doc("accounts/"+key).get();
    if(snap.exists)S.acct=clone(snap.data());
    else{S.acct={name,created:Date.now(),exercises:{},bodyweight:[]};S.key=key;try{await S.db.doc("accounts/"+key).set(S.acct)}catch(e){writeErr(e)}}
  }catch(e){S.msg="Could not open the log. Check your connection and try again.";return render()}
  S.acct.exercises=S.acct.exercises||{};S.acct.bodyweight=S.acct.bodyweight||[];
  S.key=key;S.name=S.acct.name||name;S.msg="";
  ls.set("gymlog.last",S.name);
  const names=ls.get("gymlog.names",[]).filter(n=>slug(n)!==key);names.unshift(S.name);ls.set("gymlog.names",names.slice(0,6));
  if(S.unsub)S.unsub();
  S.loaded=false;S.workouts=[];
  S.unsub=S.db.collection("accounts/"+key+"/workouts").onSnapshot(snap=>{
    S.workouts=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.startedAt||0)-(a.startedAt||0));
    S.loaded=true;
    if(S.view!=="workout")render();
  },()=>{S.msg="Lost the live link to your log. Reload the page.";render()});
  S.view="home";render();
}
function logout(){if(S.unsub)S.unsub();Object.assign(S,{key:null,acct:null,workouts:[],cur:null,parts:[],sore:{},repeatFrom:null,flash:null,view:"login",ro:false,lastName:""});render()}

/* ---------- workout actions ---------- */
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function start(){
  const c={id:newId(),startedAt:Date.now(),date:today(),status:"active",parts:[...S.parts],sore:{...S.sore},ex:[]};
  S.cur=c;
  if(S.repeatFrom){
    const src=S.workouts.find(w=>w.id===S.repeatFrom);
    (src?src.ex:[]).forEach(e=>{const st=S.acct.exercises[e.k]||{name:e.name,part:e.part,type:e.type,step:2.5,lo:8,hi:12};c.ex.push(buildEntry(e.k,st,c.sore))});
  }
  S.parts=[];S.sore={};S.repeatFrom=null;S.flash=null;S.adding=c.ex.length===0;S.openSet={};S.finishing=false;
  S.view="workout";saveCur();render();window.scrollTo(0,0);
}
function addExercise(name,part){
  const c=S.cur;const k=slug(name);
  if(!k){S.addMsg="Type an exercise name.";return render()}
  if(c.ex.some(e=>e.k===k)){S.addMsg="That one is already in this workout.";return render()}
  let st=S.acct.exercises[k];
  if(!st)st={name:String(name).trim(),part,type:part==="cardio"?"cardio":"lift",step:2.5,lo:8,hi:12,note:"",used:Date.now()};
  else st=Object.assign({},st,{used:Date.now()});
  S.acct.exercises[k]=st;saveAcct({exercises:{[k]:st}});
  c.ex.push(buildEntry(k,st,c.sore));
  if(!c.parts.includes(st.part))c.parts.push(st.part);
  S.adding=false;S.addMsg="";saveCur();render();
  const el=document.getElementById("ex-"+(c.ex.length-1));if(el)el.scrollIntoView({block:"start"});
}
async function finish(){
  const c=S.cur;const wasDone=c.status==="done";
  c.ex.forEach(e=>{if(e.sets){e.sets=e.sets.filter(s=>(s.done||s.t)&&s.r>0).map(s=>({w:s.w,r:s.r,done:true}))}});
  c.ex=c.ex.filter(e=>e.type==="cardio"?(e.cardio&&(e.cardio.km||e.cardio.min)):e.sets.length);
  if(!c.ex.length){
    clearTimeout(saveT);
    try{if(!S.ro)await wRef(c.id).delete()}catch(e){}
    S.flash={msg:"Nothing was logged, so the workout was discarded.",prs:[],empty:true};S.cur=null;S.view="home";return render();
  }
  const prs=[];
  c.ex.forEach(e=>{
    const b=bestPrior(e.k,c.id);
    if(e.type==="cardio"){if(b.km>0&&(e.cardio.km||0)>b.km)prs.push(`${e.name}: ${fmtN(e.cardio.km)} km, your longest yet`);return}
    let best=null;e.sets.forEach(s=>{if(!best||e1(s.w,s.r)>e1(best.w,best.r))best=s});
    if(best&&b.e1>0&&e1(best.w,best.r)>b.e1+0.01)prs.push(`${e.name}: ${fmtN(best.w)} kg × ${best.r} (est. 1-rep max ${Math.round(e1(best.w,best.r))} kg)`);
  });
  c.status="done";c.endedAt=c.endedAt||Date.now();
  await saveNow();
  const sets=setsDone(c),mins=Math.round((c.endedAt-c.startedAt)/60000);
  S.flash={msg:wasDone?"Changes saved.":"Workout done.",sub:wasDone?"":`${c.ex.length} exercise${c.ex.length>1?"s":""} · ${sets} set${sets===1?"":"s"}${mins>0&&mins<600?` · ${mins} min`:""}`,prs};
  S.cur=null;S.view="home";render();window.scrollTo(0,0);
}
async function leaveWorkout(){await saveNow();S.cur=null;S.view="home";render()}

/* ---------- views ---------- */
function vLogin(){
  const recent=ls.get("gymlog.names",[]);
  return `<main class="wrap login">
  <div class="mark">${BARBELL}<h1 class="brand">Gym<span>Log</span></h1><p class="sub">Sets, reps and kilos. Harder than last time.</p></div>
  <form id="loginForm" class="stack">
    <label for="nameIn" class="lbl">Your name</label>
    <input id="nameIn" autocomplete="off" autocapitalize="words" value="${esc(S.lastName)}" placeholder="Type your name">
    <button class="btn primary big" ${S.dbReady?"":"disabled"}>${S.dbReady?"Open my log":"Connecting..."}</button>
  </form>
  ${recent.length?`<div class="stack"><span class="lbl">On this phone</span><div class="chips">${recent.map(n=>`<button class="chip" data-act="quick" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div></div>`:""}
  ${S.msg?`<p class="${S.msg.startsWith("Opening")?"sub":"err"}">${esc(S.msg)}</p>`:""}
  <p class="fine">Use the same name every time.</p>
  </main>`;
}
function nav(){
  const t=[["home","Train"],["history","History"],["progress","Progress"],["weight","Weight"]];
  return `<nav class="nav"><div class="in">${t.map(([v,l])=>`<button data-act="go" data-v="${v}" class="${S.view===v?"on":""}" ${S.view===v?'aria-current="page"':""}>${ICON[v]}${l}</button>`).join("")}</div></nav>`;
}
function roBanner(){return S.ro?`<div class="banner warn">Saving is switched off right now. Tell Ulf.</div>`:""}
function vHome(){
  const active=S.workouts.filter(w=>w.status==="active");
  const done=doneWs();const recent=done.slice(0,5);
  const ws=weekStart();const week=done.filter(w=>w.startedAt>=ws);
  const soreParts=S.parts.filter(p=>p!=="cardio"&&lastTrained(p));
  const rep=S.repeatFrom&&S.workouts.find(w=>w.id===S.repeatFrom);
  const now=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  let h=`<main class="wrap">${roBanner()}
  <div class="hello"><div class="stack" style="gap:4px"><span class="date">${now}</span><h1>Hi, ${esc(S.name)}</h1></div><button class="link" data-act="logout">Switch</button></div>`;
  if(S.flash){
    h+=S.flash.empty?`<div class="banner info">${esc(S.flash.msg)}</div>`
      :`<section class="card done-card"><div class="stack" style="gap:2px"><b>${esc(S.flash.msg)}</b>${S.flash.sub?`<span>${esc(S.flash.sub)}</span>`:""}</div></section>`;
    if(S.flash.prs.length)h+=`<section class="card pr-card"><h2 style="color:var(--gold)">New personal records</h2>${S.flash.prs.map(p=>`<div class="prline"><span class="badge">PR</span><span>${esc(p)}</span></div>`).join("")}</section>`;
  }
  if(S.loaded&&done.length)h+=`<div class="stats">
    <div class="stat"><b>${week.length}</b><span>This week</span></div>
    <div class="stat"><b>${week.reduce((n,w)=>n+setsDone(w),0)}</b><span>Sets this week</span></div>
    <div class="stat"><b>${done.length}</b><span>All time</span></div></div>`;
  if(!S.loaded)h+=`<p class="sub">Loading your workouts...</p>`;
  active.forEach(w=>{
    h+=`<section class="card resume"><div class="stack" style="gap:2px"><span class="lbl">Unfinished workout</span><h3>${(w.parts||[]).map(p=>PN[p]).join(" + ")}</h3><span class="fine">${fmtDate(w.startedAt)} · ${(w.ex||[]).length} exercise${(w.ex||[]).length===1?"":"s"} so far</span></div>
    ${S.confirm===w.id?`<div class="row"><span>Throw this workout away?</span><button class="btn danger small" data-act="delyes" data-id="${w.id}">Yes, discard</button><button class="btn small" data-act="delno">Keep</button></div>`:
    `<div class="grid2"><button class="btn primary" data-act="resume" data-id="${w.id}">Resume</button><button class="btn" data-act="del" data-id="${w.id}">Discard</button></div>`}</section>`;
  });
  h+=`<section class="stack"><h2>What are you training today?</h2>
  <div class="tiles">${PARTS.map(([k,l])=>{const lt=lastTrained(k),on=S.parts.includes(k);return `<button class="tile ${on?"on":""}" data-act="part" data-v="${k}" aria-pressed="${on}" aria-label="${l}"><span class="ck">✓</span><b>${l}</b><small>${lt?"Last: "+ago(lt):"Not trained yet"}</small></button>`}).join("")}</div>`;
  if(soreParts.length){
    h+=`<div class="card" style="gap:12px"><div class="stack" style="gap:2px"><span class="lbl">Soreness since last time</span><span class="fine">Optional, but it shapes today's plan. Still sore: match last time. Never got sore: an extra set unless the pump was great.</span></div>`;
    soreParts.forEach(p=>{h+=`<div class="stack" style="gap:6px"><b>${PN[p]}</b><div class="chips">${SORE.map(([v,l])=>`<button class="chip soft ${S.sore[p]===v?"on":""}" data-act="sore" data-p="${p}" data-v="${v}">${l}</button>`).join("")}</div></div>`});
    h+=`</div>`;
  }
  if(rep)h+=`<div class="banner info spread"><span>Repeating ${fmtShort(rep.startedAt)}: ${(rep.ex||[]).length} exercises will load.</span><button class="link" data-act="norepeat">Clear</button></div>`;
  h+=`<button class="btn primary big" data-act="start" ${S.parts.length&&!S.ro?"":"disabled"}>${S.parts.length?"Start "+S.parts.map(p=>PN[p]).join(" + "):"Pick what to train"}</button></section>`;
  if(recent.length){
    h+=`<section class="stack"><h2>Repeat a past workout</h2>${recent.map(w=>`<div class="card past"><div class="stack"><b>${(w.parts||[]).map(p=>PN[p]).join(" + ")}</b><span class="fine">${fmtShort(w.startedAt)} · ${(w.ex||[]).map(e=>esc(e.name)).join(", ")}</span></div><button class="btn small ghost" data-act="repeat" data-id="${w.id}">Repeat</button></div>`).join("")}</section>`;
  }else if(S.loaded&&!active.length){
    h+=`<div class="card empty">Your first workout starts here. Pick a body part above, then add exercises as you go.</div>`;
  }
  return h+`</main>`;
}
function exCard(e,i){
  const c=S.cur;const st=S.acct.exercises[e.k]||{};
  const last=lastTime(e.k,c.id);const open=S.openSet[i];
  const nd=e.sets?e.sets.filter(s=>s.done).length:0,nt=e.sets?e.sets.length:0;
  const all=e.type==="cardio"?!!(e.cardio&&(e.cardio.km||e.cardio.min)):(nt>0&&nd===nt);
  let h=`<section class="card" id="ex-${i}"><div class="exhead"><span class="exnum ${all?"all":""}">${all?"✓":i+1}</span><div class="stack" style="gap:0;min-width:0"><span class="tagline">${PN[e.part]||""}</span><h3>${esc(e.name)}</h3></div>${e.type==="cardio"?"":`<span class="count ${all?"all":""}">${nd}/${nt}</span>`}</div>`;
  if(st.note)h+=`<p class="note">${esc(st.note)}</p>`;
  if(e.type==="cardio"){
    const lc=last&&last.e.cardio;
    const pace=lc&&lc.km&&lc.min?`, ${fmtN(rnd(lc.min/lc.km))} min/km`:"";
    h+=lc?`<p class="last">Last time, ${fmtShort(last.w.startedAt)}: <b>${fmtN(lc.km)} km in ${fmtN(lc.min)} min${pace}</b>${lc.eff?`, effort ${lc.eff}/10`:""}</p><div class="target"><span class="tgt">Target</span><span>Go further than ${fmtN(lc.km)} km, or cover it in under ${fmtN(lc.min)} min.</span></div>`
      :`<p class="last">First time logging this. Today sets the baseline.</p>`;
    const cd=e.cardio||{};
    h+=`<div class="grid3">
      <div class="field"><label class="lbl" for="min-${i}">Minutes</label><input id="min-${i}" inputmode="decimal" data-f="min" data-i="${i}" value="${cd.min??""}"></div>
      <div class="field"><label class="lbl" for="km-${i}">Km</label><input id="km-${i}" inputmode="decimal" data-f="km" data-i="${i}" value="${cd.km??""}"></div>
      <div class="field"><label class="lbl" for="eff-${i}">Effort /10</label><input id="eff-${i}" inputmode="numeric" data-f="eff" data-i="${i}" value="${cd.eff??""}"></div></div>`;
  }else{
    const lo=st.lo||8,hi=st.hi||12;
    if(last)h+=`<p class="last">Last time, ${fmtShort(last.w.startedAt)}: <b>${last.e.sets.filter(s=>s.r>0).map(s=>`${fmtN(s.w)}×${s.r}`).join(", ")}</b></p>`;
    else h+=`<p class="last">First time. Pick a weight you can lift for about ${lo} to ${hi} reps.${BW.has(e.k)?" Bodyweight move: enter your total weight (bodyweight plus or minus any added weight or assistance).":""}</p>`;
    if(e.tgt)h+=`<div class="target"><span class="tgt">Target</span><span><b>${e.tgt.map(s=>`${fmtN(s.w)}×${s.r}`).join(", ")}</b>. ${esc(e.why||"")}</span></div>`;
    if(e.push)h+=`<div class="target push"><span class="tgt">+1 set</span><span>${esc(e.push)}</span></div>`;
    const b=bestPrior(e.k,c.id);let prIdx=-1,prV=b.e1+0.01;
    if(b.e1>0)e.sets.forEach((s,j)=>{if(s.done&&e1(s.w,s.r)>prV){prV=e1(s.w,s.r);prIdx=j}});
    h+=`<div class="sets"><div class="colhead"><span>Set</span><span>kg</span><span></span><span>Reps</span><span></span><span></span></div>`;
    e.sets.forEach((s,j)=>{
      const t=(e.tgt||[])[j]||(e.tgt||[])[(e.tgt||[]).length-1]||{};
      h+=`<div class="set ${s.done?"done":""}">
        <span class="sn ${j===prIdx?"prb":""}">${j===prIdx?"PR":j+1}</span>
        <input id="w-${i}-${j}" inputmode="decimal" aria-label="Set ${j+1} kg" data-f="w" data-i="${i}" data-s="${j}" value="${s.w??""}" placeholder="${t.w??"kg"}">
        <span class="x">×</span>
        <input id="r-${i}-${j}" inputmode="numeric" aria-label="Set ${j+1} reps" data-f="r" data-i="${i}" data-s="${j}" value="${s.r??""}" placeholder="${t.r??"reps"}">
        <button class="tick" data-act="done" data-i="${i}" data-s="${j}" aria-pressed="${!!s.done}" aria-label="Mark set ${j+1} done">${ICON.check}</button>

function chart(pts,unit,id){
  if(pts.length<2)return `<p class="fine">${pts.length?"One entry so far. The chart starts after your second.":"No data yet."}</p>`;
  const W=340,H=180,L=38,R=14,T=12,B=24;
  const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);
  if(hi-lo<1){lo-=1;hi+=1}const padv=(hi-lo)*.12;lo-=padv;hi+=padv;
  const raw=(hi-lo)/3,mag=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x0=pts[0].x,x1=pts[pts.length-1].x,span=x1-x0||1;
  const X=x=>L+(x-x0)/span*(W-L-R),Y=y=>T+(hi-y)/(hi-lo)*(H-T-B);
  let g="";for(let v=lo;v<=hi+1e-9;v+=step){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${rnd(v)}</text>`}
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area=`${d}L${X(x1).toFixed(1)},${Y(lo)}L${X(x0).toFixed(1)},${Y(lo)}Z`;
  const dots=pts.map((p,i)=>`<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="${i===pts.length-1?5:4}"/>`).join("");
  CH[id]={pts:pts.map(p=>({px:X(p.x),py:Y(p.y),label:p.label})),W,H};
  return `<div class="chartbox" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart, ${pts.length} points, in ${unit}">${g}<path class="ar" d="${area}"/><path class="ln" d="${d}"/>${dots}<circle class="hl" r="6" cx="-20" cy="-20"/>
  <text class="ax" x="${L}" y="${H-6}">${fmtShort(x0)}</text><text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort(x1)}</text></svg><div class="tip" hidden></div></div>`;
}
const CH={};
function attachCharts(){
  Object.keys(CH).forEach(id=>{
    const box=document.getElementById(id);if(!box){delete CH[id];return}
    const svg=box.querySelector("svg"),tip=box.querySelector(".tip"),hl=box.querySelector(".hl"),c=CH[id];
    const move=ev=>{
      const r=svg.getBoundingClientRect();const sx=(ev.clientX-r.left)/r.width*c.W;
      let best=c.pts[0];c.pts.forEach(p=>{if(Math.abs(p.px-sx)<Math.abs(best.px-sx))best=p});
      hl.setAttribute("cx",best.px);hl.setAttribute("cy",best.py);
      tip.hidden=false;tip.textContent=best.label;
      const left=Math.min(Math.max(best.px/c.W*r.width,70),r.width-70);
      tip.style.left=left+"px";tip.style.top=(best.py/c.H*r.height)+"px";
    };
    const out=()=>{tip.hidden=true;hl.setAttribute("cx",-20)};
    svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);svg.addEventListener("pointerleave",out);
  });
}

    if(known)part=known.part;else{for(const[p,list]of Object.entries(STARTER))if(list.some(x=>slug(x)===k)){part=p;break}}
    addExercise(n,part);
  }else if(id==="bwForm"){
    const kg=num(document.getElementById("bwKg").value),d=document.getElementById("bwDate").value||today();
    if(!kg||kg<=0)return;
    S.acct.bodyweight=S.acct.bodyweight.filter(x=>x.d!==d).concat([{d,kg}]).sort((a,b)=>a.d<b.d?-1:1);
    saveAcct({bodyweight:S.acct.bodyweight});render();
  }
});

render();
(async()=>{
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    S.db=firebase.firestore();
    try{await S.db.enablePersistence({synchronizeTabs:true})}catch(e){}
  }catch(e){S.db=null}
  S.dbReady=true;if(!S.db)S.msg="Can't reach the database. Check your internet and reload.";
  if(S.view==="login")render();
})();
</script>
